name: Build and Publish Docker Image

# PATH-FILTERED: only runs when the web app actually changed, so the web
# container isn't restarted by MCP-only merges (and vice versa).
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "models/**"
      - "img/**"
      - "nginx.conf"
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

# Only the build on main (and tags) is kept: a PR build published nothing and
# was rebuilt from scratch on merge anyway. Two merges in quick succession
# don't need two full builds either — the newer one supersedes the older.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # The deployment server is ARM: build arm64 only, natively on an ARM
    # runner (free on public repos) instead of emulating it on x86 with QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64
